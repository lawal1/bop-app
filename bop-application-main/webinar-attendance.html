<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOP Webinar Attendance Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080808;
      --line: #2a2a2a;
      --text: #f7f7f2;
      --muted: #9d9d96;
      --green: #0e821d;
      --green-light: #16a62b;
      --danger: #ff8a8a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(14, 130, 29, 0.22), transparent 24rem),
        linear-gradient(145deg, #050505 0%, #0d0f0d 54%, #050505 100%);
      background-size: 46px 46px, 46px 46px, auto, auto;
      color: var(--text);
      font-family: Montserrat, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    main {
      width: min(100%, 520px);
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(10,10,10,0.94);
      box-shadow: 0 28px 84px rgba(0,0,0,0.5);
      padding: clamp(28px, 6vw, 44px);
    }

    .logo {
      width: 128px;
      height: auto;
      display: block;
      margin: 0 auto 28px;
    }

    .title {
      margin: 0 0 30px;
      color: var(--text);
      font-size: clamp(22px, 6.4vw, 34px);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 1.06;
      text-align: center;
      text-transform: uppercase;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 9px;
      color: #cccccc;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0;
      background: rgba(255,255,255,0.035);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      outline: none;
      padding: 15px 16px;
      transition: border-color 160ms ease, background 160ms ease;
    }

    input::placeholder { color: #5e5e58; }

    input:focus {
      border-color: var(--green-light);
      background: rgba(255,255,255,0.055);
    }

    button {
      width: 100%;
      min-height: 56px;
      margin-top: 10px;
      border: 0;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      transition: background 160ms ease, opacity 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: #119524;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .message {
      min-height: 22px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .message.ok { color: #8df2a0; }
    .message.err { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/koppoh-logo-green.png" alt="Koppoh">
    <h1 class="title">Webinar Attendance Form</h1>

    <form id="attendanceForm">
      <label>
        Full Name
        <input name="name" autocomplete="name" placeholder="Your full name" required>
      </label>

      <label>
        Email
        <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>

      <label>
        Phone
        <input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+2348012345678" pattern="^\+234[0-9]{10}$" title="Use Nigeria format: +2348012345678" required>
      </label>

      <button type="submit">Submit and Join Webinar</button>
    </form>

    <div class="message" id="message" aria-live="polite"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const config = {
      webinarTitle: params.get("title") || "BOP Webinar",
      webinarDate: params.get("date") || "",
      webinarTime: params.get("time") || "",
      meetingUrl: params.get("meeting") || params.get("meetingUrl") || "",
    };

    const form = document.getElementById("attendanceForm");
    const message = document.getElementById("message");
    const button = form.querySelector("button");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.className = "message";
      message.textContent = "";
      button.disabled = true;
      button.textContent = config.meetingUrl ? "Joining..." : "Saving...";

      const data = {
        ...Object.fromEntries(new FormData(form).entries()),
        webinarTitle: config.webinarTitle,
        webinarDate: config.webinarDate,
        webinarTime: config.webinarTime,
      };

      const payload = JSON.stringify(data);
      const blob = new Blob([payload], { type: "application/json" });

      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/webinar-attendance", blob);
      } else {
        fetch("/api/webinar-attendance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload,
          keepalive: true,
        }).catch(() => {});
      }

      if (config.meetingUrl) {
        window.location.href = config.meetingUrl;
      } else {
        message.className = "message ok";
        message.textContent = "Attendance saved.";
        form.reset();
        button.disabled = false;
        button.textContent = "Submit and Join Webinar";
      }
    });
  </script>
</body>
</html>
